id: C23-a4-base-de-grauwe-polan
label: regression
title: A4 on base money - De Grauwe and Polan's line (low inflation means less than 10% a year), tested as their abstract states it, beside Teles and Uhlig's 12%
parent:
  id: C02-a4-base
  hash: 2fef33fe9a6f10f0bf09c0969dae963c82a531270e647eb5edf622f48454f483
question: >-
  De Grauwe and Polan (CEPR DP 2841, 2001) write that the strong link between inflation and money
  growth "is almost wholly due to the presence of high (or hyper-) inflation countries", and that "the
  relationship between inflation and money growth for low inflation countries (on average less than 10%
  per annum over the last 30 years) is weak". Does that line hold in the study's panel: where inflation
  averages less than 10% a year, is the slope of inflation on base money growth far below the slope above
  10%, and below one - and is the finding "two worlds" (C02, with Teles and Uhlig's 12%) the same when the
  line is drawn at 10%?
method: >-
  C02's method in every part (its panel, code/panel.py as committed in 2445181 with its seven rules; its
  windows, the year-ends 1950, 1960, ..., 2020; its model pi = alpha + beta * mu + gamma * g + e, pooled OLS,
  standard errors clustered by money; the verdict on beta's 95% interval; the readings code/longrun.py
  fixed for C02), with these changes and nothing else.
  (1) The line. What the abstract says, and all that is taken from it (the paper's full text is sold and
  was not bought; the page, frozen as data/cepr/dp2841/2026-10-01, carries the abstract only): a country
  is "low inflation" if its inflation averages less than 10% per annum over the last thirty years; the
  relation between inflation and money growth is "weak" there; the full sample's relation is strong but
  not proportional and is carried by the high-inflation countries. Not taken, because the abstract does
  not give them: their money measure, their regression, their sample's list, their controls, their
  definition of "weak". The study's reading of "weak" is C02's rule for a line, written for Teles and
  Uhlig and applied here unchanged: "the line separates" if theta > 0 with p < 0.05 and beta below the
  line excludes 1. "Low" is inflation below 10% a year; the code's "above the line" is more than 10, which
  differs from "10 or more" only on an average equal to 10 to the last digit.
  (2) The headline reading, as stated: the line drawn on the window's inflation pi (the abstract classifies
  countries by their inflation), on C02's windows: pi = alpha + beta * mu + delta * A + theta * mu * A +
  gamma * g + e, A = 1 where pi is above 10; beta below the line and beta + theta above, each with its
  interval and the verdict rule of C02. Drawn on inflation, a split cuts the sample on its outcome and pulls
  the slope below the line toward zero whatever the relation (C02's own warning, which holds for Teles and
  Uhlig's line as for this one): so the same line is drawn on money growth mu beside it, as C02 did,
  and the two readings are said together, whichever way they come out.
  (3) Where the study's window differs from "the last thirty years", said plainly. The abstract's unit is a
  country, classified by its own average inflation over thirty years (a paper of 2001: 1970 to 2000 is
  taken as those years), one point per country, about 160 countries. This study's unit is a ten-year
  window of a money, classified by the window's own average, 1950 to 2020 (1959 to 2019 on C22's grid),
  every window of a money counting, errors clustered by money. So (a) a money that inflated at 25% in the
  1970s and 1980s and at 3% after is one high-inflation country for them and a high and a low window
  here; (b) a ten-year average above 10% is a narrower claim than a thirty-year average above 10%; (c) the
  windows reach before 1970 and after 2000, outside their span; (d) money here is base money, theirs the
  abstract does not name. Three counted variants bring the reading nearer to theirs, one change each; none
  is chosen over the headline, and every verdict is reported.
  (4) Variant A, C22's grid: the headline reading (2) on windows between the year-ends 1949, 1959, ...,
  2019 (C22's grid; the first window is empty; code/longrun.py C22's readings).
  (5) Variant B, thirty years: one window per money from the year-end 1970 to the year-end 2000, with base
  money, the CPI and real GDP positive at both ends and neither end inside the euro (C02's rules for a
  window), mu, pi and g computed as in C02 over the thirty years; the line drawn on that average inflation
  at 10 (on pi, as stated, and on mu beside); one observation per money, robust (HC1) errors as C02's "one
  window per money" variant. This is their unit and their span, with the study's money and panel.
  (6) Variant C, the money classified by its own average: each money is "high inflation" if the mean of its
  windows' pi (C02's windows, equal weights, every window it has) is above 10, and "low" otherwise; the
  model of (2) with A = 1 for every window of a high money, on C02's windows, errors clustered by money. This
  carries their country-level classification into the pooled windows. It classifies by the outcome, as
  theirs does, and is said so.
  (7) Reported apart, outside their span: the headline reading (2) on the windows that start in or after
  2000 or end in or before 1970 (the windows lying wholly outside 1970-2000, which cannot have built their
  line), with its n, so that a thin result is said thin. Nothing is fitted on them to the headline's
  coefficients: the same model is read on them.
  (8) Read together, once, in words fixed here. (i) "Their line, as stated, holds in the study's panel"
  if the headline reading (2) separates (as C02's rule defines it) on the pi split and the mu split, and
  variants A, B and C give the headline's verdict on their pi split. (ii) "Their line holds on one reading
  and not on another" is said, with the readings named, if any of those differ. (iii) "Their line does not
  hold" if the headline's pi split does not separate. Whatever (i)-(iii) says is said as it comes, and
  nothing is refitted to move it.
parameters:
  window_years: 10
  window_ends: [1950, 1960, 1970, 1980, 1990, 2000, 2010, 2020]
  window_ends_variant_A: [1949, 1959, 1969, 1979, 1989, 1999, 2009, 2019]
  window_variant_B: [1970, 2000]
  interval: 0.95
  prior_line_de_grauwe_polan_pct: 10
  prior_line_de_grauwe_polan_source: "CEPR DP 2841 abstract: 'low inflation countries (on average less than 10% per annum over the last 30 years)'; data/cepr/dp2841/2026-10-01/dp2841-page.html"
  prior_line_teles_uhlig_pct_beside: 12
  line_significance: 0.05
  variants:
    - A - C22's grid (year-ends 1949 to 2019), the line on pi and on mu
    - B - one thirty-year window per money, 1970 to 2000, the line on pi and on mu, robust errors
    - C - the money classified by the mean of its windows' inflation (above 10 means high), C02's windows
  apart: the headline reading on the windows lying wholly outside 1970-2000
  headline_reading: the line on the window's inflation pi, C02's windows
  beside_the_headline: the line on money growth mu; Teles and Uhlig's 12% from C02's committed run
  seen_before_writing: >-
    C02's result has been seen, and so have those of C21 and C22 (C20 never ran): STATE m7 asks that a
    child card of C02 say so. Seen of C02: the slope is one for one (0.97, interval 0.90 to 1.03, 590 decade
    windows in 152 moneys); Teles and Uhlig's 12% separates both ways (drawn on inflation: 0.26 below, 1.02
    above; drawn on money growth: 0.20 below, 1.05 above); the held-out checks hold; the windows of the euro
    area, Britain, Sweden and Japan in 2010-2020 sit above 12% on money growth with inflation near 1% a year.
    Seen of C22: the same model on decades ending in December 2019 gives 0.91 (0.86 to 0.97), "partly", and
    the 12% line separates on both grids. The long version, which says that the line separates "either way",
    has been read. Not seen, and not computed before this card is committed: any split of the study's windows
    or moneys at 10% a year, any count of windows below or above it, any slope of either side, and any
    one-window-per-money reading on 1970-2000. The 10% is not chosen by this study: it is the abstract's own
    figure. An expectation, fixed here so that it cannot steer anything: that the line at 10% behaves like
    the line at 12%, since few windows lie between them; nothing below depends on it.
