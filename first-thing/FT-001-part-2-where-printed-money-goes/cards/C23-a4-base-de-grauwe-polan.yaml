period: 1950 to 2020 (seven decade windows, C02's); 1959 to 2019 (variant A); 1970 to 2000 (variant B)
sample: >-
  C02's rule, unchanged: every money of the panel with base money, the CPI and real GDP at both ends of a
  window, whatever its inflation, its size or its history - set by data coverage only, with C02's drops
  (IMF groups; the six moneys flagged units_break; money-years using the euro outside the euro area; a
  euro member's windows once it uses the euro, the euro area one money from 1999). The line at 10% is
  applied to every window, never used to drop one. Variant B's sample is the moneys with all three series
  at both year-ends 1970 and 2000, by coverage only. The list of moneys and windows used is written with
  the result.
out_of_sample: >-
  The line is De Grauwe and Polan's, drawn by them on about 160 countries and about 1970-2000 and
  here only applied, never refitted. The windows lying wholly outside 1970-2000 are the part of the
  panel their span did not hold (method 7): the headline reading is read there apart, with its n. C02's held-out
  checks (by years, by five folds of moneys) are C02's own, reported there, and are not rerun for the line.
  Variants A and B share most of their years with the headline: they check whether the reading depends on
  where the decades end and on the unit, not whether it holds on other records.
failure: >-
  If the headline reading, on the pi split, does not separate (theta not above zero at p < 0.05, or beta
  below 10% includes one), the study says the line of De Grauwe and Polan, as their abstract states it, does
  not hold here, and that the "two worlds" depend on where the line is drawn (12% or 10%). If it separates
  on one of the two splits (pi, mu) and not the other, or if any of variants A, B and C gives another
  verdict on the pi split than the headline's, the study says so, naming which, and the long version says
  that the line's reading depends on the unit or the window, never that it holds. If fewer than 30 moneys
  have a thirty-year window (variant B), or if either side of a split has fewer than 20 windows (10
  moneys in variant B), that reading is said thin and counts neither way. If the headline separates and
  every variant agrees, the study says the two worlds do not depend on whether the line is drawn at 12% or
  10%, and says in the same sentence that this is the abstract's line only, not their method.
not: >-
  Not a replication of De Grauwe and Polan: their text beyond the abstract was not read, their method,
  sample and money measure are unknown here, and the study never says what their regression found, only what
  their abstract states. Not a search for a better line: 10% is theirs, 12% is Teles and Uhlig's, no other
  value is tried. Not causal (C02). Not C02's variants, its held-out checks or its window from 2020, nor C03
  (broad money), nor a figure. Not their claim that the full sample's relation "is not proportional", which
  C02 reads as it reads it (one for one on base money).
