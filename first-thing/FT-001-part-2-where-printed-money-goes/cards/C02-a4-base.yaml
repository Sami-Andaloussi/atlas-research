period: 1950 to 2020 (seven decade windows); 2020 to the panel's last common year apart
sample: >-
  Every money of the panel with base money, the CPI and real GDP at both ends of a window, whatever its
  inflation, its size or its history: the sample is set by data coverage only. Dropped, by the panel's
  rules and never by outcome: IMF groups; the six moneys flagged units_break (their base money and GDP
  share no unit in the open data: Equatorial Guinea, Slovakia, Sierra Leone, Somalia, Venezuela,
  Zimbabwe); money-years using the euro outside the euro area; a euro member's windows once it uses the
  euro (the euro area counts as one money from 1999, its founding members have no base money here
  before 1999 - a hole, notes/data.md). High-inflation moneys stay in: the prior lines are tested on
  them, not used to remove them. The list of moneys and windows used is written with the result.
out_of_sample: >-
  By years: the model fitted on the windows ending in or before 1990 (1950-1990) predicts the windows
  starting in or after 1990 (1990-2020) - Teles and Uhlig's own split year (p. 2), taken, not chosen;
  reported: the out-of-sample R2 against the training mean, and beta re-estimated on the held-out
  windows with the verdict rule. By moneys: five folds fixed by code position, each predicted by the
  fit on the other four; reported: each fold's out-of-sample R2 and beta. The prior lines are checked
  out of sample by construction: they were drawn by others on other samples (Teles and Uhlig: OECD
  countries, 1970-2005, M1) and are only applied here.
failure: >-
  The verdict fails to hold if the held-out windows (by years) or two or more of the five folds give a
  beta whose interval tells another verdict; the study then says the long-run relation depends on the
  period or the moneys, and names which. If fewer than 30 moneys reach both halves of the year split,
  the split cannot judge and says so.
not: >-
  Not a causal estimate: money growth and inflation are both outcomes of policy and shocks; this is the
  association the quantity theory predicts, over long averages. Not M1: base money here (broad money
  is C03's; Teles and Uhlig use M1). Not the published version of Teles, Uhlig and Valle e Azevedo
  (2016): their working paper's line, said. Not 1870-1950 (C04, waiting for the Jorda-Schularick-Taylor
  files).
