id: C02-a4-base
label: regression
title: A4 - base money growth and inflation over the long run, every money with data, 1950-2020
question: >-
  Across every money with the data, over ten-year averages from 1950 to 2020, does inflation follow
  base money growth one for one once real output growth is taken out - and does the answer hold on
  moneys and decades the fit did not see, and above and below the lines prior work drew?
method: >-
  Panel: code/panel.py as committed in 2445181 (its seven rules, written at its top, are part of this
  card). Windows: non-overlapping ten-year windows between the year-ends 1950, 1960, ..., 2020 (seven
  windows); the window 2020 to the panel's last year with base money, CPI and real GDP for at least half
  the moneys is reported apart (shorter, and inside the latest printing). For a money i and a window
  from year a to year b: mu = 100 * ln(B(b)/B(a)) / (b - a), with B base money at the year's end;
  pi = 100 * ln(P(b)/P(a)) / (b - a), with P the CPI's yearly average; g = 100 * ln(Y(b)/Y(a)) / (b -
  a), with Y real GDP. The model: pi = alpha + beta * mu + gamma * g + e, pooled OLS, standard errors
  clustered by money. The quantity theory with a stable velocity says beta = 1 and gamma = -1.
  Verdict on beta's 95% interval: "prices followed base money one for one" if it holds 1 and excludes 0;
  "no relation" if it holds 0 and excludes 1; "partly" if it excludes both; "cannot tell" if it holds
  both. The same rule is read on gamma against -1 and 0, reported beside.
  Prior lines, tested and never refitted: Teles and Uhlig's 12% (notes/sources.md: the working paper,
  pp. 3 and 11), applied two ways - as they drew it, on the window's inflation pi (a split on the
  outcome, which truncates it and pulls beta toward zero whatever the relation), and on money growth mu
  (a split on the regressor, which does not truncate the outcome). Each way: pi = alpha + beta * mu +
  delta * A + theta * mu * A + gamma * g + e, A = 1 above the line; beta below the line and beta +
  theta above, each with its interval and the verdict rule above. "The line separates" if theta > 0
  with p < 0.05 and beta below the line excludes 1. De Grauwe and Polan's line is not run here: their
  text is unread (notes/sources.md); a child card states it from their text, before it runs.
parameters:
  window_years: 10
  window_ends: [1950, 1960, 1970, 1980, 1990, 2000, 2010, 2020]
  interval: 0.95
  prior_line_teles_uhlig_pct: 12
  prior_line_de_grauwe_polan: not run here; fixed from their text by a child card, before it runs
  line_significance: 0.05
  held_out_years: fit on windows ending in or before 1990; test on windows starting in or after 1990
  held_out_moneys: five folds, fold = position of the money's code in the sorted list of codes, modulo 5
  variants:
    - five-year windows (year-ends 1950, 1955, ..., 2020)
    - twenty-year windows (1950-1970, 1970-1990, 1990-2010)
    - one window per money, its first to its last year with all three series (at least 20 years)
    - moneys whose base-money seam is flagged (base_break) dropped
    - without g
    - with window dummies (a common shock per decade)
    - Teles and Uhlig's yield correction (p. 10, eq. 19) where the short rate is at least 1% at both
      ends of the window - mu replaced by mu + 0.5 * 100 * ln(i(b)/i(a)) / (b - a)
