failure: 'If the reproduction with R = 0 fails, the run is void. If the upper bound is more than twice the lower, the
  post gives the range and says why (R, or the interest deducted), never one number.'
not: 'Not the loss on deposits that paid interest below inflation (LL-121''s). Not what any one household paid: an
  average over households of what households held. Not an observed reclassification: R is a shortfall of other deposits'' change read as the reclassification, and it would
  also count any other move out of those deposits in 2020Q4. Not a welfare cost, not a verdict on the policy. Not "a tax" for
  what the state did not collect. Not investment advice.'
created: '2026-10-08'
sample: 'Not a sample: every month of the period, the whole of each stock as the statistics define it; the start is
  the door''s (February 2020), told. The baseline quarters are fixed here, before the run, by their position around
  the move, never by the size of R they give (both baselines were seen as totals by the audits: said, P12).'
out_of_sample: 'Not applicable: a measurement with nothing fitted. Its checks are internal: the reproduction of C13
  with R = 0; the baseline beside (2019''s quarters); the monthly timing in H.6.'
