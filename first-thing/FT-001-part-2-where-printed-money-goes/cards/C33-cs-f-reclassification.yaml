question: 'Part 2''s map v15, P2-8 and K7: since February 2020, how much purchasing power did inflation take from US
  households'' own cash and checking deposits, per household, as a range, once the savings deposits reclassified as
  checkable after the change to Regulation D (the Federal Reserve''s release of 24 April 2020) are measured against
  other deposits'' own path rather than against zero — and who gained (§7.7)?'
method: 'C13''s method in every part (its formula, price base, quarterly stock mapping, interest deduction from April
  2021, households from TTLHH, the whole stock as a share of GDP only, seigniorage and the base created, the base''s
  place now), with one change and nothing else. (1) The reclassification R, fixed before the run: households'' other
  deposits (Z.1, BOGZ1FL193030205Q, quarterly) change in each quarter; R is the shortfall of that change in 2020Q4,
  the quarter in which the Z.1 households'' checkable deposits and currency (BOGZ1FL193020005Q) took the move, against
  the mean change of the four surrounding quarters (2020Q2, 2020Q3, 2021Q1, 2021Q2): R = mean(surrounding) -
  change(2020Q4), floored at 0 and capped at the rise of checkable deposits and currency in 2020Q4. Beside it, not in
  the range: the same shortfall against the mean change of 2019''s four quarters. (2) The range per household: upper
  bound, what inflation took from the stock as published, as if none of it paid interest (C13''s); lower bound, what
  it took from the stock less R from 2020Q4 on, minus the interest the national interest-checking rate (ICNDR) would pay from April 2021
  (C13''s). The range carries R: printed as a range, never a midpoint. (3) The timing beside, never in the range,
  all holders: M1 (M1SL, H.6, monthly) and M2 (M2SL) from January to August 2020, M1''s jump showing the month (when, never how much: H.6''s all holders against Z.1''s households) H.6
  moved savings deposits into M1, and savings deposits (SAVINGSL) to April 2020, where the frozen series stops (said).
  The households'' quarterly Z.1 series is the one the range uses. If H.6 dates the move in May 2020 and Z.1''s
  households in 2020Q4, both dates are printed as each source''s, never reconciled by us: the range uses Z.1''s
  quarter. Beside R, its spread: R computed against each surrounding quarter alone. (4) Words, fixed here: "tax" only for what the state collected (seigniorage on currency, C13''s 5a); the
  rest is "what inflation took", with who gained beside it as §7.7''s balance-sheet reasoning, never a
  measurement here (debtors at fixed rates below inflation: the state as the largest, households and firms with
  fixed-rate debt; banks through their spread; on reserves paid at the Fed''s rate in 2022-23, the Fed paid the wider
  spread, so on that leg the state lost); R is said as "a shortfall read as the reclassification", never "$X moved". (5) Reproduction: with R = 0, the run must reproduce C13''s stored
  four stored values per household (upper and lower, in current and in constant dollars) to the dollar (C13 found no reclassification, so its lower bound used R = 0);
  otherwise it is void. (6) The parts of C13 that never touch R (the whole stock as a share of GDP, seigniorage, the
  base created, the deferred asset, the base''s place now) are carried unchanged from C13''s stored run, named as
  carried; the reproduction of item 5 is what licenses it.'
