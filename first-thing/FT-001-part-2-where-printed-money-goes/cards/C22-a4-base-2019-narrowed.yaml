period: 1949 to 2019 (seven decade windows on the grid, the first empty, so 1959 to 2019 in practice; the last from December 2009 to December 2019)
sample: >-
  C02's rule, unchanged: every money of the panel with base money, the CPI and real GDP at both ends of a
  window, whatever its inflation, its size or its history - set by data coverage only, with C02's drops
  (IMF groups; the six moneys flagged units_break; money-years using the euro outside the euro area; a
  euro member's windows once it uses the euro, the euro area one money from 1999). The first window,
  1949-1959, is empty by the same rule: no money of the panel has all three series at the end of 1949
  (the check's coverage count, no outcome read). The five named
  points are the text's, fixed above, not picked from this grid. The list of moneys and windows used is
  written with the result.
out_of_sample: >-
  C02's checks, in its words, on this grid: by years, the model fitted on the windows ending in or before
  1990 predicts those starting in or after 1990 (the out-of-sample R2 against the training mean, and beta
  re-estimated on the held-out windows with the verdict rule); by moneys, the five folds by code position.
  Beside C02 this grid is not new data: it shares nine years in ten with C02's windows, so it checks
  whether the reading depends on where the decades end, not whether it holds on other records. Its year
  split tests two decades (1999-2009, 2009-2019) where C02's tests three, the 1990s sitting in neither
  half: a held-out difference beside C02 can come from this change in which decades are tested, and is
  not read as 2020's effect.
failure: >-
  C02's, in its words: the verdict fails to hold if the held-out windows (by years) or two or more of the
  five folds give a beta whose interval tells another verdict; the study then says the long-run relation
  depends on the period or the moneys, and names which. If fewer than 30 moneys reach both halves of the
  year split, the split cannot judge and says so. Beside C02: if this card's verdict on beta, or whether
  the line on money growth separates, differs from C02's, the study says that the long-run reading
  depends on where the decades end (C02's grid, or the grid moved one year, which also leaves out 2020),
  and names which. One of the four currencies of the exception (the euro area, Britain, Sweden, Japan)
  whose 2009-2019 point is not "above the line on money growth, below it on inflation" is said, by name,
  not to show the exception without 2020's printing; the United States gets no such sentence.
not: >-
  Not a new question and not a replacement: C02's question on windows moved one year, reported beside
  C02's windows, never instead. Not 2020's share of any decade: a currency's two windows differ by 2020
  out and 2010 in, so their gap is not the effect of 2020's printing alone, and is not told as such. Not
  causal (C02). Not C02's variants, nor its window from 2020, nor a figure. Not checker A's figures,
  which were a checker's scratch on other windows.
