id: C22-a4-base-2019-narrowed
label: regression
title: A4 on decades ending in December 2019 - C20 narrowed by its card check (B1, O1, M1-M4), C02's model beside its own windows
parent:
  id: C20-a4-base-2019
  hash: 0758500b7a61eaf4642eb7430cbcd08173c7f65d669a9815ab2e76437bba261e
question: >-
  As C02, on decade windows that end in December 2019 instead of December 2020, reported beside C02's
  own windows and never instead of them. It answers grid checker A's blocking finding (G1 in
  check/2026-09-30-grid-answers.md) with a number where the long version now says "not measured here":
  the rich currencies' decade ending in 2020 read their base money at December 2020, after the pandemic
  printing, and none of the inflation after it. Does their exception - base money growing faster than the
  12% line with inflation below it - hold without 2020's printing, and does C02's reading of the long run
  change when no decade holds it?
method: >-
  C20's card in every part, with only the changes its narrow card check names
  (check/2026-09-30-opus-child-cards-c20-c21.md: B1, O1, M1-M4); C20 never runs. C20's method, as it
  now reads: C02's method in every part, on other windows; nothing is added, and C02's variants and its window from
  2020 are not rerun here (plan/e1-production.md, Decisions, "The two results put to Sami: both taken";
  "a fix answers, it does not add"). As it reads here:
  Panel: code/panel.py as committed in 2445181 (its seven rules, written at its top, are part of this
  card), with the readings code/longrun.py fixed for C02 before C02's run (fccce91), unchanged: the sample,
  the clustered interval, "above the line", the out-of-sample R2, the five folds, the failure clause.
  Windows: non-overlapping ten-year windows between the year-ends 1949, 1959, 1969, 1979, 1989, 1999, 2009
  and 2019 (seven windows on the grid; the first, 1949-1959, is empty, since no money of the panel has
  all three series at the end of 1949, so six in practice) - C02's grid moved one year earlier, so that every window keeps C02's ten years
  and none holds a year-end after 2019. A single window 2010-2019 would be nine years, and a window
  2009-2019 beside C02's 2000-2010 would overlap it: C02's design (non-overlapping, ten years) allows
  neither, and allows the whole grid moved. For a money i and a window from year a to year b:
  mu = 100 * ln(B(b)/B(a)) / (b - a), with B base money at the year's end; pi = 100 * ln(P(b)/P(a)) /
  (b - a), with P the CPI's yearly average; g = 100 * ln(Y(b)/Y(a)) / (b - a), with Y real GDP. So the
  last window reads base money from December 2009 to December 2019 and prices from 2009's average to
  2019's. The model: pi = alpha + beta * mu + gamma * g + e, pooled OLS, standard errors clustered by
  money. Verdict on beta's 95% interval: "prices followed base money one for one" if it holds 1 and
  excludes 0; "no relation" if it holds 0 and excludes 1; "partly" if it excludes both; "cannot tell" if
  it holds both. The same rule is read on gamma against -1 and 0, reported beside. Prior line, tested and
  never refitted: Teles and Uhlig's 12% (notes/sources.md: the working paper, pp. 3 and 11), applied two
  ways as in C02 - on the window's inflation pi and on money growth mu. Each way: pi = alpha + beta * mu +
  delta * A + theta * mu * A + gamma * g + e, A = 1 above the line; beta below the line and beta + theta
  above, each with its interval and the verdict rule above. "The line separates" if theta > 0 with
  p < 0.05 and beta below the line excludes 1.
  The points the text names: the euro area, Britain, Sweden, Japan and the United States - the five
  whose 2010-2020 points from C02 the long version names (code/registry.py, the list it reads from C02's
  points). For each, its 2009-2019 mu and pi, read beside its 2010-2020 point. The exception is the four
  whose 2010-2020 point the placement below puts "above the line on money growth, below it on inflation"
  (the euro area, Britain, Sweden, Japan); the United States, below the line on money growth in
  2010-2020, is reported beside its 2010-2020 point with no exception sentence. Each point is placed by
  C02's line as C02 draws it (above = more than 12, on mu and on pi), a reading fixed here before any
  number: "above the line on money growth, below it on inflation" (mu above 12, pi not above 12 - the
  exception as the text states it for 2010-2020); "above the line on both"; or "below the line on money
  growth" (mu 12 or less). Said per currency, by name, never counted into a share.
  Reported beside, never instead, wherever the text states the exception: the long version, the
  edition, the post's arrow on the decades. They give each of the five 2009-2019 points beside its 2010-2020 point,
  and C20's beta and the line's two readings beside C02's, each with its interval and verdict. C02's
  table, scatter, hooks and signposts keep C02's windows; C20 draws no figure. If a verdict differs, the
  text says so where it gives C02's (the failure clause below).
parameters:
  window_years: 10
  window_ends: [1949, 1959, 1969, 1979, 1989, 1999, 2009, 2019]
  interval: 0.95
  prior_line_teles_uhlig_pct: 12
  line_significance: 0.05
  held_out_years: >-
    C02's, in its words: fit on windows ending in or before 1990; test on windows starting in or after
    1990 (Teles and Uhlig's split year, taken, not moved). On this grid the fit reads 1959-1989 (the window
    1949-1959 is empty) and the test 1999-2019; the window 1989-1999 holds the split year and sits in neither half, said.
  held_out_moneys: five folds, fold = position of the money's code in the sorted list of codes, modulo 5
  points_named: [U2, GB, SE, JP, US]
  exception_named: [U2, GB, SE, JP]
  variants: none - C02's seven variants and its window from 2020 stand on C02's windows
  seen_before_writing: >-
    Every result of the study as told, by the producer who told it, including C02's run in full (its
    points, headline, lines, held-out checks, variants and window from 2020) and C15's dated printings
    (among them the euro area's, Britain's and Japan's of 2009-2012); C20's narrow card check; checker A's grid report (check/2026-09-30-opus-grid-a.md), whose
    finding B1 gives its own scratch growth rates of base money over 2010-2019 for four currencies - read,
    not used, not written here. The windows are set by C02's design (ten years, non-overlapping), the rule
    the session's brief gave before this card, not by those rates. No 2009-2019 point, and no window of
    this grid, has been computed.
