id: C28-a4-units-guard
label: regression
title: A4 on base and broad money, C25's and C27's runs with a units guard on the World Bank fills of real GDP,
  the CPI and nominal GDP
parent:
  id: C25-a4-base-hko-fill
  hash: f53710a65d62718375e664083ebfa605f7dc0206151efe63aeb6de2040b5db99
kind: correction
seen:
- check/2026-10-07-opus-grid-check-a.md finding 1 (Burkina Faso 1970-80 real growth 205.7% a year, gamma -0.07 becomes
  about -0.73 without that window, the slope below the line 0.22 about 0.25, broad below 0.40 about 0.61)
- check/2026-10-07-opus-grid-check-b.md (findings F1-F6)
