question: 'The grid check of 2026-10-07 found that panel rule 3 (a World Bank series filling the years IFS lacks,
  scaled by the median IFS/World Bank ratio) splices series that are not in one unit: Burkina Faso''s IFS real GDP
  before 1980 is about a billionth of the World Bank''s level, the median ratio is one, and the 1970-80 window reads
  real growth of 206% a year. C25''s and C27''s readings (and C22''s grid read by C25) take that window. With a
  guard that refuses such a splice, by the rule below and nothing else, what do C25''s and C27''s readings give?'
method: 'C25''s method in every part for base money (its fill of the CPI, its windows on C02''s grid and C22''s
  grid beside, its model pi = alpha + beta * mu + gamma * g + e, pooled OLS with errors clustered by money, its
  verdicts, Teles and Uhlig''s 12% line on pi and on mu with C02''s rule for ''the line separates'', its held-out
  checks by years and by five folds), and C27''s for broad money on C02''s grid, with one change and nothing else.
  (1) The units guard, applied to the annual panel after C25''s fill and before any window: for real GDP (rgdp),
  the CPI and nominal GDP, money by money (the United States and the euro area excepted: their own series, rules
  4 and 5), the panel''s series is set against the World Bank''s raw series (NY.GDP.MKTP.KN, FP.CPI.TOTL, NY.GDP.MKTP.CN,
  vintage 2026-09-30) over the years both exist; where the ratio''s maximum over its minimum is 100 or more, the
  two are not in one unit (the panel''s rule 6 reads a factor of 100 as a unit change), and the money''s variable
  is read from the World Bank''s series alone, as it is, in the years it has (growth and inflation are unit-free);
  the other years of that variable are missing. (2) Everything else is C25''s and C27''s: the same panels, rules,
  windows, model, lines, held-out checks and readings. (3) The reproduction: the run first rebuilds C25''s filled
  readings (both grids) and C27''s with the guard switched off and must reproduce their stored results (every coefficient,
  interval and verdict, to 1e-9); if not, the run is void and says so. (4) Reported: for each of C02''s grid on
  base money, C22''s grid on base money and C02''s grid on broad money, the summary C25 and C27 report (n windows
  and moneys; beta, its interval and verdict; gamma and its verdict; the line on pi and on mu, each side''s slope,
  interval and verdict, theta and its p, ''separates''; the held-out windows by years and the five folds), beside
  C25''s or C27''s stored value; the windows whose mu, pi or g change under the guard, one line each; and the points.'
