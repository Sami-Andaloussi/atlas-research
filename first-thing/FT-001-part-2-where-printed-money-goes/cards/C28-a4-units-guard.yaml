period: 1950 to 2020 (seven decade windows); C22's grid, 1959 to 2019, beside; broad money on C02's grid
sample: 'C25''s and C27''s rules, unchanged: every money of the panel with the money, the CPI and real GDP at both
  ends of a window, set by data coverage only. The guard changes which source is read for a variable of a money
  whose two sources are not in one unit; it never selects a window by its inflation or its money growth. The guard''s
  switches were counted before the run from the sources'' levels only (the ratio of the panel''s series to the World
  Bank''s): real GDP of Burkina Faso (a spread of about 1e9) and of Suriname (about 2.7e3); no CPI and no nominal
  GDP.'
out_of_sample: 'C25''s checks, in its words: the model fitted on windows ending in or before 1990 predicts those
  starting in or after 1990, and five folds by code position; the same on C22''s grid (held out from 1999 by its
  own rule) and on broad money.'
failure: 'C25''s failure clause on each grid: the verdict fails to hold if the held-out windows by years, or two
  or more of the five folds, give a beta whose interval tells another verdict. And this card''s own: if the reproduction
  with the guard off fails, nothing is read.'
not: 'Not a new question: C25''s and C27''s readings with a units fault corrected. Not a check of every series against
  the World Bank (25 windows differ from the World Bank''s real growth by more than two points a year without a
  unit change; they are not touched, and are read beside in C29). Not causal. Not 1870-1950, not De Grauwe and Polan''s
  line, not C02''s variants.'
