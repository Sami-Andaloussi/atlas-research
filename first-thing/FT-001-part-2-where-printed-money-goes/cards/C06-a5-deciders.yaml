period: episodes starting 1950-2026 whose 36-month horizon ends by the panel's common end
sample: >-
  C05's list, made by rule before any outcome is read: every episode that is neither accommodation nor
  censored, whatever followed it. Accommodation episodes are reported apart with their outcomes, never
  pooled into the tests; censored episodes are reported with what happened so far, counted neither way.
  No episode is matched or dropped on anything measured after m0 (the deciders are dated at m0, or m0 + 3
  for the floor and interest on reserves while inflation is below T).
out_of_sample: >-
  Nothing is fitted: codings are fixed rules and the test permutes labels. The thresholds come from
  outside the episodes (T from Teles and Uhlig; the band, the floor and the deficit are round values fixed
  here before any episode is listed). The check outside the cases that could build a pattern is the era
  rule: a decider separates only if its sign holds in every era stratum with enough cases, so a pattern
  carried by one era alone does not pass; the grids and variants are counted.
failure: >-
  If no decider separates, part 2 says "we cannot conclude" on what decides - the dossier's expected
  outcome, since the deciders move together by era - keeps A4, and still reports every episode's
  measured outcomes. If a decider separates on O1 but its sign reverses on O2's net bound, the study
  says prices and broad money tell different stories and does not choose. A decider coded for fewer than
  ten episodes is described, never tested.
not: >-
  Not causal: the deciders are not assigned at random and move together (floating, floors and interest on
  reserves arrive in the same decades). Excess reserves are never an outcome: they rise with any purchase
  whatever banks lend (O3 guard; McLeay, Radia and Thomas, 2014, p. 25). Asset prices are never tested.
  The fiscal theory is not tested here (Sargent, 1982, cited; LL-515). The money-demand side of A5 is
  C07's velocity test.
