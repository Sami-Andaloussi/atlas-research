period: 1950 to 2020 (seven decade windows), the CPI filled from the database where the panel lacks it
sample: >-
  C03's rule, unchanged: every money of the panel with broad money, the CPI and real GDP at both ends of a
  window, whatever its inflation, its size or its history - set by data coverage only, with C03's drops (IMF
  groups; the six moneys flagged units_break; money-years using the euro outside the euro area; a euro
  member's windows once it uses the euro, the euro area one money from 1999). The fill widens the set of
  windows by the availability of a CPI, never by an outcome: a window enters because both its ends now have
  a CPI, not because of its inflation or its money growth; high-inflation moneys stay in. The list of moneys
  and windows used, and the added ones, is written with the result.
out_of_sample: >-
  C03's checks, in its words, on the filled panel: by years, the model fitted on the windows ending in or
  before 1990 predicts those starting in or after 1990 (the out-of-sample R2 against the training mean, and
  beta re-estimated on the held-out windows with the verdict rule); by moneys, the five folds by code
  position. The windows the fill adds are new records for the economies that lacked prices (not new data for
  the others), so the card checks whether C03's reading holds when the loss of those windows is repaired;
  the database is another source of the same quantity, and where it overlaps the panel's own CPI the guard
  (C25's) has tested that it is one series.
failure: >-
  As C03 and C25. The verdict fails to hold if the held-out windows (by years) or two or more of the five
  folds give a beta whose interval tells another verdict than the headline's; the study then says the
  long-run relation for broad money depends on the period or the moneys, and names which (as C03's held-out
  reading already does on the unfilled panel: it is one of the five readings of (5), not a new failure). If
  fewer than 30 moneys reach both halves of the year split, the split cannot judge and says so. If broad
  money and base money (C25's filled run) tell different verdicts on the windows both cover, part 2 says the
  answer depends on the aggregate, and does not pick one.
not: >-
  Not a new question and not a replacement: C03's windows, model and lines on a panel whose CPI gaps are
  filled, read as the ruling of 2026-10-02 reads C25 and C26 (the filled run is the pilot's reading, the
  unfilled one said beside it). Not causal (C02). Not C03's variants, its World Bank broad-money sub-variant
  nor its window from 2020, not 1870-1950 (C21), not De Grauwe and Polan's 10% line (C23), not C22's grid.
  Not a repair of the broad money, base money or GDP series the panel lacks. Not a new fill rule and not a
  claim that the database's CPI is the truth where the panel has none: the fill is C25's stated rule, and an
  economy whose database series disagrees with the panel's (the guard) is left unfilled. No interpolation,
  and no value replaced.
