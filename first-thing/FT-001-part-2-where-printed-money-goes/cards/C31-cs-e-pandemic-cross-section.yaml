period: money December 2019 to December 2021; inflation December 2021 to December 2023; Q6, money 2007-09 and
  inflation 2009-11
failure: 'The reading fails to hold if the leave-one-out check moves it (then the robust reading leads and the moving
  economy is named), or if the Huber and OLS slopes give different readings (both printed, the robust leading, the
  down-weighted economies listed). A null reading bounded is not a failure: it is printed with what it rules out.'
not: 'Not causal: "went with". Not a separation of the money from the fiscal demand that carried it (BIS 67 p. 5).
  Not a test of base money: base money is a described variant, never a claim. Not BIS 67''s regression (excess money,
  other dates, 30 economies). No dated-crisis variant: no list of 2021-23 currency or sovereign crises is in hand
  (Laeven & Valencia''s 2026 file holds banking crises only), and dropping economies for a crisis inside the outcome
  window would remove the currency channel, a mediator.'
created: '2026-10-08'
sample: 'Every economy IFS covers at both money dates and both price dates, by coverage only; the main set by a rule
  on inflation before the money window (2015-19 below 10%), never on the outcome, and on the control''s coverage
  (said, the run without the control beside). Designed before any 2022-23 inflation was read for this card; the
  calibration on past cross-sections (2001-15, without 2007) by the map''s audits and this card''s check used pre-2020
  outcomes only, never Q6''s.'
out_of_sample: 'Money 2007-09 against inflation 2009-11, its prediction written above before the run, with its rate
  under the permutation null; and the past cross-sections of the calibration, which built none of this card''s
  readings.'
