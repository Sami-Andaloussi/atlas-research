- 'bank/checks/FT-001-2026-10-08-card-check-c30-c31.md (this card''s check, before any run: the calibration repeated,
  Huber bootstrap half-widths 0.084-0.152 with the control and 0.071-0.125 without; coverage 134 economies with money
  for 2019-21, 125 with both CPI dates, 111 calm-start; those lacking the 2023 CPI named; 2019-21 broad growth SD 5.75,
