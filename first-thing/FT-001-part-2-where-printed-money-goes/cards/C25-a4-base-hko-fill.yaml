period: 1950 to 2020 (seven decade windows), the CPI filled from the database where the panel lacks it; C22's grid, 1959 to 2019, beside
sample: >-
  C02's rule, unchanged: every money of the panel with base money, the CPI and real GDP at both ends of a
  window, whatever its inflation, its size or its history - set by data coverage only, with C02's drops
  (IMF groups; the six moneys flagged units_break; money-years using the euro outside the euro area; a euro
  member's windows once it uses the euro, the euro area one money from 1999). The fill widens the set of
  windows by the availability of a CPI, never by an outcome: a window enters because both its ends now have
  a CPI, not because of its inflation or its money growth; high-inflation moneys stay in. The list of moneys
  and windows used, and the added ones, is written with the result.
out_of_sample: >-
  C02's checks, in its words, on the filled panel: by years, the model fitted on the windows ending in or
  before 1990 predicts those starting in or after 1990 (the out-of-sample R2 against the training mean,
  and beta re-estimated on the held-out windows with the verdict rule); by moneys, the five folds by code
  position. The windows the fill adds are new records for the economies that lacked prices (not new data
  for the others), so the card checks whether C02's verdict holds when the loss of those windows is
  repaired; the database is another source of the same quantity, and where it overlaps the panel's own CPI
  the guard has tested that it is one series.
failure: >-
  The verdict fails to hold if the held-out windows (by years) or two or more of the five folds give a
  beta whose interval tells another verdict; the study then says the long-run relation depends on the
  period or the moneys, and names which. If fewer than 30 moneys reach both halves of the year split, the
  split cannot judge and says so.
not: >-
  Not a new question and not a replacement: C02's windows, model and lines on a panel whose CPI gaps are
  filled; reported beside C02, never instead, until the engine decides with Sami what the long version says.
  Not causal (C02). Not C02's variants nor its window from 2020, not broad money (C03), not 1870-1950
  (C21), not De Grauwe and Polan's 10% line (C23). Not a repair of the base money or GDP series the panel
  lacks. Not a claim that the database's CPI is the truth where the panel has none: the fill is a stated
  rule, and an economy whose database series disagrees with the panel's (the guard) is left unfilled and
  listed. No interpolation, and no value replaced.
