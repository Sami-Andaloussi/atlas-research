failure: 'If the reproduction of item 7 fails, the map''s numbers are rewritten from this run. If any panel would set
  two quantities on one axis in different units or bases, or carry a window total of prices across a change of state,
  the figure is refused by the card, not drawn.'
not: 'Not evidence: an illustration (frame e''s count guards it). Not a cause: no price reading of the door anywhere
  in the headline, and no money credited to the purchases. Not a decomposition of ours: Blanchard & Bernanke''s, as
  theirs, under its caption (their model has no money variable). Not a selection of shock series by us.'
created: '2026-10-08'
sample: 'Two windows told by the door, fixed by the map before this card (C01''s dates); nothing selected by the run.
  The cut dates of item 6''s facts (February to May 2020; calendar 2021) were chosen after the v7 and v8 audits had
  shown prices by those splits (P12, said here and in the methods).'
out_of_sample: 'Not applicable: a measurement of two told windows; the check is reproduction against the audits''
  independent recomputations (item 7).'
