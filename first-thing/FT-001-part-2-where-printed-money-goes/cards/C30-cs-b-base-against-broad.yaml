id: C30-cs-b-base-against-broad
label: regression
title: CS-B — in calm decades, did each point of central-bank money growth go with less inflation than each point of
  the public's money, on the same windows?
parent:
  id: C28-a4-units-guard
  hash: 99c1880e37bc40362d6e384ccdee22527df703e34cada520b83763c989e1e497
kind: extension
seen:
