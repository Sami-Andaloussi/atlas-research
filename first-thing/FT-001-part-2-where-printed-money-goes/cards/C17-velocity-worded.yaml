id: C17-velocity-worded
label: test
title: '"No one spends"? worded by its bias - US broad money velocity with and without the Fed''s purchases, and across moneys from the closed list'
parent:
  id: C14-velocity-net
  hash: d2a38c1c5ce4a02908f8da712465f7a2870d2122cd52a84c9549ad0d4a4b2668
question: >-
  As C14 - did broad money's velocity fall further than the interest rate predicts when the US printed,
  and does the fall remain once M2 is taken net of the Federal Reserve's purchases - with each outcome
  worded only as far as the net series can carry it.
method: >-
  C14's method in every part (C07's three forms, fit and cutoff for the United States - the fit to
  2008Q2 -, z and its bands, the R2 floor; M2net and Vnet), with these changes answering the narrow check
  of 2026-09-30 (check/2026-09-30-opus-cards-narrow.md: O7, m6):
  (1) The wording follows the net series' bias. M2net subtracts every purchase, including those from
  banks, which create reserves and no deposit: Vnet is at or above velocity net of the deposits the
  purchases created. So, per form and test period:
  - below the prediction on M2 and on Vnet: "velocity fell beyond what the rate predicts, even net of all
  the Fed's purchases - money held rather than spent" (robust to the bias);
  - below on M2, not below on Vnet (|z| <= 1 on Vnet): "the fall was no larger than the Fed's purchases;
  how much was deposits created and how much money held cannot be told from these series";
  - below on M2, above the prediction on Vnet (z >= 2 on Vnet): "the Fed's purchases exceed the fall;
  since subtracting them all overstates the deposits created, velocity net of created deposits lies
  between the two readings, and these series cannot place it";
  - below on M2, Vnet between the bands (1 < |z| < 2): "velocity fell beyond what the rate predicts on
  M2; net of the Fed's purchases, we cannot conclude";
  - not below on M2: C07's verdict on M2, unchanged; Vnet is reported but adds nothing to it.
  The count over the three forms is kept for each series, and the sentence is chosen by the counts
  (two forms of three or more), never by one form picked after the test.
  (2) The cross-money variant (C07's, counted): its cutoffs are dated from C15's list - every money with
  at least 20 years of broad money, nominal GDP and a short rate before m0 of its first C15 headline
  episode that is tested (neither accommodation, censored nor set apart, the design's dating); the three
  forms fitted before m0's year and tested after; counted by verdict and form. The US cutoff stays C07's
  (2008Q2), which C15's first US episode (m0 September 2008, C09's list and the narrow check's rerun)
  leaves unchanged.
parameters:
  change_from_parent: [the verdict worded by the net series' bias, a sentence for Vnet above the prediction, cross-money cutoffs from C15's list]
  forms: [log-log with r + 1, semi-log, Selden-Latane]
  z_moved: 1
  z_beyond: 2
  min_in_sample_r2: 0.3
  forms_for_a_sentence: 2 of 3
  cross_money_cutoff_list: C15 headline, first tested episode per money
data:
  - dataset: the datasets of C14-velocity-net, at the same vintages
  - dataset: the result of C15-e-episodes-closed (its run, naming C15's hash), for the cross-money cutoffs
  - dataset: the panel (code/panel.py at 2445181) - broad money, nominal GDP, the short rate, for the cross-money variant
period: 1959Q1 to 2026Q2; the net variant from 2008Q3; the cross-money variant each money's own span
sample: >-
  As C14. The cross-money variant takes every money meeting the coverage condition before its first tested
  C15 episode, whatever happened to it.
out_of_sample: >-
  As C14: fitted only before the cutoff, judged only after it; no parameter refitted on the test period.
failure: >-
  As C14. If the forms split with no two agreeing on a series, that series' sentence is "the forms
  disagree", with the count.
not: >-
  As C14: not a structural estimate of money demand; not an estimate of which purchases were from
  non-banks; M2net an upper reading of velocity net of created deposits.
created: '2026-09-30'
