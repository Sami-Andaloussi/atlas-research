period: 1950-01 to the panel's last month of base money (2026)
sample: >-
  Entry by rule, never by name (the guards' first row): every money of the panel with base money and
  GDP is scanned, whatever happened to it. Dropped by the panel's rules only: IMF groups; the six
  units_break moneys; money-months using the euro outside the area (the euro area is one money from
  1999, its founding members have no base money before 1999 here - a hole). Accommodation episodes stay
  on the list, apart; failures and the dead are in by construction (a money whose series stops is
  scanned to its last month). The doors are told, not entered: whether the rule enters the US printings
  is reported, never forced.
out_of_sample: >-
  Not applicable: a list made by a rule, with nothing fitted. X, Y, T, H and q are fixed here, before
  any list exists, from the door's own scale and from published work; the grid of nine X-Y lists and the
  T, H and q variants show how much the list moves, and every list's size is reported (FRAMING F63,
  variants counted).
failure: >-
  The list is too thin for C06 if fewer than ten episodes are neither accommodation nor censored at H =
  36; C06 then says "we cannot conclude" for want of cases, and the list is still reported. If one money
  gives more than a quarter of the headline episodes, every count is given with it and without it.
not: >-
  Not a list of "printings that caused inflation" or of any outcome: episodes are entered on base money
  and GDP alone. Not a list of named cases. Base money here is the IMF's reserve money or monetary base
  as each central bank reports it; a change of definition inside an episode is flagged (base_break),
  not corrected.
