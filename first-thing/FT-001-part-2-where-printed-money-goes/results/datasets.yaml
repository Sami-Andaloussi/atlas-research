# Every dataset part 2 reads, for the publication (toolkit ft.publish: each frozen dataset's MANIFEST.md, which gives its URL,
# retrieval date and hash; the fetched data itself is never published). Part 2 reads no reconstructed dataset.
# The cards' data lines describe builds in words ("the panel of C02", "the datasets of C05, at the same vintages", "the result
# of C15"); this list names the paths and vintages the code (code/panel.py, deciders.py, velocity.py, tax.py, longrun.py,
# hko.py, door.py) and notes/data.md actually read: the panel's IFS, World Bank, FRED and ECB series, and what the later cards
# add (the deciders' FRED and WEO series, C21's JST freeze, C24's UCDP files, C25-C27's World Bank inflation database).
# A "result of Cnn" line names a stored run (results/runs/), not a dataset, and needs no entry here.
# Not listed, by design: macrohistory/JST-R6 (card C04's data line). It waits on request 273069c2437d, was never frozen under
# that name, and C04 stopped at its header check; the JST files that were frozen afterwards are jst/macrohistory and
# jst/documentation (card C21's lines), listed below. The Correlates of War lists (cow/*) are named by cards C24 and C26 for
# the years before 1946 and listed, though never opened (no episode starts before 1946: code/deciders.py asserts it).
