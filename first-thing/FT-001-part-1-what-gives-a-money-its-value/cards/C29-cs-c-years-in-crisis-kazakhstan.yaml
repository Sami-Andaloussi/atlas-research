seen:
- 'C27-cs-c-years-in-crisis-corrected (every result, seen before this card)'
- 'This card is C27 rerun on C28 (C26 rerun) after the author''s decision of 2026-10-22 ("Kazakhstan: go, minimal"): only Kazakhstan''s splice is applied (the IMF''s price index for Kazakhstan, IFS PCPI_IX, divided from 2020-01 by its 2020 ratio to the World Bank, World Development Indicators, FP.CPI.TOTL, ft.data.splices); Myanmar''s monthly 1970-1972 and Congo''s 2009 are read again as the source reads them (named in the jump barrier''s RESOLVED, flagged, a separate correction proposed). Its rules are C27''s; it reads C28''s card and run where C27 read C26''s'
- 'C24-cs-c-years-in-crisis (every result: 972 crisis years in 7,024 money-years from August 1971, 13.8%, and the other spans), seen and printed before this card'
- 'C27 was C24 rerun on C26 (C23 corrected) after the correction of 2026-10-21 (the author''s A): the IMF''s price index for Kazakhstan (IFS PCPI_IX, frozen data/dbnomics/IMF/IFS/{M,A}~~PCPI_IX/2026-09-30) changes units in January 2020 and doubles with no flag; the World Bank, World Development Indicators, FP.CPI.TOTL (frozen data/worldbank/FP.CPI.TOTL/2026-09-30/page-001.json) matches it to 2019 and runs 1.9427 times below it from 2020, so the panel reads IFS from 2020-01 divided by that ratio (ft.data.splices); the jump barrier (ft.quant.jumps) drops Myanmar''s monthly 1970-1972, which stands 1.32-1.34 times IFS''s own annual index, and reads Congo''s 2009 level, and any rise into 2009 or into 2010, as cannot be read (its 2009 months run on from 2008''s and step down to a new base at 2010-01, while IFS''s annual 2009 rises 2.8%: the two contradict each other), from every source, and compares no level across 2009 to 2010 (ft.data.splices DROPS, YEAR_DROPS, WB_DROPS, LINKS; the 2010 level is the new base). Its rules are C24''s; it reads C26''s card and run where C24 read C23''s'
- 'C23''s run (its crises begun, money-years and rates per span) was seen and printed in the study.'
- 'The years this card counts were seen in part before it, each by an isolated checker''s own code on frame b''s rows, not by
  this session: grid check 3 (crisis spells from start to restoration, about 18%, 21% and 29% of money-years by span); grid
  check 4 (about 22%, 23% and 32%); grid check 5 (spells to restoration 17.7%, 20.7% and 29.5%; money-years with prices up
  a fifth or more, 6.9%, 10.6% and 12.4% on the yearly mean of the 12-month changes, 6.9%, 11.6% and 15.1% on three
  months at 20% or more). The definition below was chosen after these were seen, for the reason said in method (1): it
  is Reinhart and Rogoff''s own measure and the one the study''s text defines (an inflation crisis is a year when prices
  rose by a fifth or more).'
question: 'Part 1''s map v22 (H1c / A3, context) and grid check 5''s finding 1 (the third return of the same defect, a
  reshape): in each of C28''s three spans, what share of the money-years with a price reading were years in which prices
  rose by a fifth or more? Printed beside C28''s crises begun, so that the count of crises begun is never read as a count
  of crisis years.'
method: '(1) The definition: a money-year is a crisis year when its price rise in the year is 20% or more: Reinhart and
  Rogoff''s inflation-crisis line, applied to years, as they apply it and as the study''s text defines a crisis. (2) The
  year''s rise: where frame b''s timeline (panel.timeline, frame b''s common ends, as C28 reads it) holds an annual reading
  for the year, that reading; where it holds monthly readings, the mean of the year''s monthly 12-month changes (every
  readable month of the year). (3) The money-years and their units: exactly C28''s denominator (its function reading_years
  and its Units, read from code/p1_cs_c.py, never changed): each unit-year counted once; a unit-year read by several
  economies (a union''s members, the euro''s) takes the mean of their year rises. (4) Per span (C28''s: before 1914, 1914
  to July 1971, from August 1971, by the year): the money-years, the crisis years, and their share in percent with one
  decimal; beside, C28''s crises begun per 100 money-years as C28 printed them. (5) The consumer-price-only variant beside,
  as C28 reads it (rr_cpi_only). Nothing else is computed; no cause is read.'
parameters:
  line_percent: 20
  year_rise: annual reading, else the mean of the year's monthly 12-month changes
  denominator: C28's (code/p1_cs_c.py reading_years and Units)
  spans: [before_1914, 1914_to_1971_07, from_1971_08]
  decimals: 1
matters:
  cs_c_years: 'none: a description beside C28''s count, read against no size'
