id: C28-cs-c-losses-by-era-kazakhstan
label: measurement
title: (Corrected, C26 rerun on the price panel with Kazakhstan's splice alone) CS-C — how often prices rose a fifth (20%) or more in a year, 1800–2025, per 100 money-years with a price
  reading, before 1914, from 1914 to July 1971 and from August 1971, from frame b's breaks (M3, M0 v4.2), the euro and
  each union counted once
question: 'Part 1''s map v22 (K5, the reading''s part 3; claims H1c and A3, context): how often did a money''s price
  index rise a fifth (20%) or more in a year (a loss of a sixth of what a unit buys), per 100 money-years with a price reading, before 1914, from 1914 to July 1971 and
  from August 1971, and what share of monies had at least one such crossing in each span? A description of how common
  losses were: never why.'
parent:
  id: C26-cs-c-losses-by-era-corrected
  hash: d2e7e4f2b85fc475dc348dbfc78b5ce8b7f5c7b1809e55ffad579e969cbb6b93
kind: correction
seen:
- 'C26-cs-c-losses-by-era-corrected (every result: 158 crises from August 1971 in 7,022 money-years, and the other spans), seen before this card'
- 'This card is C26 rerun after the author''s decision of 2026-10-22 ("Kazakhstan: go, minimal"): only Kazakhstan''s splice is applied (the IMF''s price index for Kazakhstan, IFS PCPI_IX, divided from 2020-01 by its 2020 ratio to the World Bank, World Development Indicators, FP.CPI.TOTL, ft.data.splices); Myanmar''s monthly 1970-1972 and Congo''s 2009 are read again as the source reads them (named in the jump barrier''s RESOLVED, flagged, a separate correction proposed). Its rules are C26''s (and C23''s), word for word; only the panel''s digest changes (2eaa1f76... to b67955f2...)'
- 'C23-cs-c-losses-by-era (every result: 158 crises from August 1971, 2.25 per 100 money-years, and the other spans), seen and printed before this card'
- 'C26 was C23 rerun after the correction of 2026-10-21 (the author''s A): the IMF''s price index for Kazakhstan (IFS PCPI_IX, frozen data/dbnomics/IMF/IFS/{M,A}~~PCPI_IX/2026-09-30) changes units in January 2020 and doubles with no flag; the World Bank, World Development Indicators, FP.CPI.TOTL (frozen data/worldbank/FP.CPI.TOTL/2026-09-30/page-001.json) matches it to 2019 and runs 1.9427 times below it from 2020, so the panel reads IFS from 2020-01 divided by that ratio (ft.data.splices); the jump barrier (ft.quant.jumps) drops Myanmar''s monthly 1970-1972, which stands 1.32-1.34 times IFS''s own annual index, and reads Congo''s 2009 level, and any rise into 2009 or into 2010, as cannot be read (its 2009 months run on from 2008''s and step down to a new base at 2010-01, while IFS''s annual 2009 rises 2.8%: the two contradict each other), from every source, and compares no level across 2009 to 2010 (ft.data.splices DROPS, YEAR_DROPS, WB_DROPS, LINKS; the 2010 level is the new base). Its rules are C23''s, word for word; only the panel''s digest changes (d5debead... to 2eaa1f76...)'
- 'The counts and rates by era were seen before this card: the M3 mission audit (an internal note)
  and the part map''s deep audits v17-v22 (internal notes) recomputed
  them (counted 166, 101, 178; about 4.3, 2.7 and 2.0 per 100 money-years, on a denominator from the first to the last
  year of each money''s price items). The eras'' boundaries, the counting of unions once and the setting apart of
  foreign-money crossings were in the map before v17; the 12-month union window, the 1993-12 to 1994-12 window and the
  first-to-last denominator first appeared on this card''s first version, after those rates were seen.'
- 'This card''s check (an internal note) recomputed the rates of its first
  version (4.30, 2.74, 2.04 per 100 money-years; 2.08 under another reading of the union window), the fiat rate with
  the euro counted once (2.16) and with the years of economies using another state''s money also taken out (2.25), and
  a lower bound on the years with no reading inside each money''s span (about 240, 139 and 22 money-years by era). This
  version changes the denominator, the union rule and the era names on that check''s findings: the euro counted once
  and the unions dated (the map''s rule, "each monetary union counted once in the numerator and the denominator
  alike"), years with no reading left out (the card''s own question, "per 100 money-years with a price reading"), the
  eras named by their dates (the card''s own "not"). None of the rules below was chosen by the rate it gives.'
- 'The second check of this card (an internal note), on its version of
  commit 54ee6b40, computed its rates (4.63, 2.93 and 2.23 per 100 money-years by span; 2.25 with Timor-Leste, Kosovo,
  Nauru and Tuvalu out; 2.26 with all nine economies with no IRR column out; 2.91 for the second span with the colonial
  shared monies counted once; 2.22 under R12''s lagged class; the consumer-price-only variant 3.68, 2.93, 2.23). This
  version applies that check''s findings: the four economies sourced and taken out, the shared-money years named, the
  set-apart reason made true, the gap rule made determinate, the title''s quantity named; none was chosen by its rate.'
- 'results/runs/C18, C19 and C20 existed (the earlier design''s runs, reused as CS-F and CS-D); this card reads none of
  them'
method: '(1) The events: the rows of frame b''s headline list (data/reconstructed/ft001-b/series.csv, M0 v4.2, pair hash
  1160cab0...e58d4) whose status is "counted": a crossing of 20% a year in a price index (three successive 12-month
  readings at 20% or more, the map''s named adaptation of the 20% line, or a year read annually), consumer prices where
  kept, a commodity or wholesale index before (as Reinhart and Rogoff''s files hold them). The rows whose status is
  "apart" (the frame''s own rule: the record beginning at or above the line, the crossing following a gap, a euro member
  after its changeover) are not counted; each is named beside the count, with its money and date. (2) The span of an
  event is set by its entry date: "before 1914" (before 1914-01), "1914 to July 1971" (1914-01 to 1971-07), "from
  August 1971" (from 1971-08); an annual entry date (a year, no month) goes to the span holding the whole year, and an
  annual 1914 or 1971 to "1914 to July 1971" (so Poland''s annual 1914 is in the second span, Fiji''s monthly 1971-11 in
  the third). A money-year goes to the span of its calendar year, 1971 to the second. The names are dates, not regimes:
  paper money with no convertibility ran inside the first span and floating rates inside the second, and the printed
  text says so beside the rates with the cases the study tells (Britain 1797-1821 and the greenbacks, 1862-79; the
  exits from gold, 1931-36). (3) The unit a year
  belongs to: each economy-year of frame b''s panel belongs to one unit of money. (a) The euro: an economy''s years from
  its entry year in euro_entry (frame a''s list, the ECB''s "Our money" page) belong to the euro, whose own readings
  (the panel''s EMU, from 1999) stand for it; the member''s own readings in those years are not counted again. (b) The
  unions XOF, XAF and XCD (members as in unions, frame a''s lists): a member''s year is the union''s when Ilzetzki,
  Reinhart and Rogoff''s fine class for that year is 1, "no separate legal tender or currency union" (the panel''s IRR
  annual file, 1946-2016: the class of the calendar year itself, not R12''s lag; a year outside the column''s start and
  end years has no class; 2016''s class carried to later years as frame b''s R12 carries it), and Montserrat''s (no IRR
  column) from its first reading; so Mali 1963-1983 (classes 2 and 4), Guinea-Bissau to 1996 (classes 2, 5 and 15),
  Equatorial Guinea 1970-1984 (classes 2 and 8) and Mauritania (never class 1) are their own. (c) Another state''s money or a
  shared money: any other economy-year of class 1 (2016''s carried; a year outside the column''s start and end years has
  no class here too; the class applied as coded, so the years IRR codes 1 for Greece in 1999-2000 and for Serbia are
  dropped too), except Zimbabwe from 2018 (Ilzetzki, Reinhart and Rogoff''s country
  chronology, 2021-08-27, p. 132, ends its "no separate legal tender" row in February 2018); and, with no IRR column,
  Timor-Leste, Kosovo, Nauru and Tuvalu over their reading spans (foreign_without_irr): the IMF''s AREAER lists them in
  its row "No separate legal tender" (AREAER 2011, the de facto classification table, PDF p. 15: Timor-Leste, Kosovo,
  Tuvalu; AREAER 2023, the same table, PDF p. 25: the four, Nauru an IMF member from 12 April 2016, PDF p. 28; AREAER 2023, PDF p. 22:
  Kiribati, Nauru and Tuvalu "use the Australian dollar as their legal tender"), their years before 2011 read on the
  2011 row, and Nauru''s 2011-2013 on the rows from 2016, said. Such a year is no money-year: its number is printed per span with the economy-years named. Where it
  is a shared money with no unit in the panel (the East African shilling in Kenya, 1948-1966; Ghana, 1949-1958), it is thus counted nowhere: those economy-years are among the named ones, said. A counted
  crossing whose entry year is such a year is set apart and named with its reason, "a year Ilzetzki, Reinhart and
  Rogoff (or the AREAER) class as no separate legal tender: another state''s or a shared money" (this holds the map''s
  Kiribati 2008-08 and Palestine 2024-02, for those two "the money not having lost at home", and any other the run
  lists). (d)
  Otherwise the economy''s own money; every year before 1946 (no class exists) is the economy''s own, and so are the
  years of the economies with readings, no IRR column and no AREAER row of (c) (no_irr_own). (4) Union events: a union''s counted crossings (members'' rows whose entry year
  is the union''s by (3b)) sorted by entry date; a crossing outside any current window opens a window of twelve months
  from its entry month (an annual entry dated at its June for this rule only) and starts an event; a crossing whose
  entry month is no more than twelve months after the opening joins that event; every XOF or XAF row with an entry date
  from 1993-12 to 1994-12 is one event (the devaluation of both CFA francs on 12 January 1994, one decision); rows and
  events printed side by side (OT09). (5) The denominator: a money-year is a calendar year from 1800 to 2025, within
  the frame''s common ends, in which frame b''s timeline for the economy (the panel rebuilt from the frozen sources by
  frame b''s own code, its digest checked against the manifest''s) holds a price reading: an annual reading of the year,
  or at least one monthly 12-month reading in it; a unit''s year is counted once whichever of its economies read it.
  Years with no reading inside a unit''s span are not counted and their number is printed per span; a year inside a
  unit''s span that its economy read but that belongs to another unit, or to none, by (3) is not a year with no
  reading. An event after 2025 is outside the count (frame b reads to 2026-08). (6) Printed per
  span: counted events, rows, apart rows named, set-apart rows named, money-years, years with no reading inside the
  units'' spans, the rate per 100 money-years to two decimals, the number of units with a reading and the share with at
  least one counted event; the unit of each span''s readings said beside (annual and often commodity indices before
  1900, monthly consumer prices after). (7) Beside, the frame''s consumer-price-only variant (variant-rr-cpi-only.csv)
  through the same rules, its money-years from the same panel with Reinhart and Rogoff''s non-CPI years not read. No
  restoration is counted (the new-unit list is incomplete: missions/FT-001-M3-new-units-2026-10-10.md).'
