method: >-
  C08 (2cbb0a80) as written, V1-V4 kept, on frame g's build after M7 section 16 (ft001-g, mapping.csv at 8ace613e).
  Written AFTER C08's run (f12a2a7e) had been seen and after the issuer layer's small check
  (bank/checks/FT-001-M7-frame-g-issuer-layer-2026-10-02-sonnet-small-check.md) had read the build C08 ran on
  (FRAMING F72: a revision made openly, after a result, said so). Section 16 changed two lines (GYEN's and ZUSD's
  limit by institution, yes to cannot be read) and, by S13, the who column of six redemption yes lines (the issuer's
  own words, the readings' words kept in the note). C08's run stays in git beside this one.
  V5 (who, the two sources): the redemption yes lines whose note keeps the readings' words "a restricted set of
  participants" are counted and named, so the page can say that the central-bank reading and the issuer describe the
  same redeemers differently; V3's classes read the who column (the issuer's words) only.
