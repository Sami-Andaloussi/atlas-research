failure: 'If the rebuilt inputs do not reproduce C15''s stored counts, the run is void. If the bootstrap interval and
  the audits'' design-effect range give different readings, both are printed, the bootstrap''s leading; the by-money interval decides the refutation, the by-year one beside.'
not: 'Not causal: an act "came before". Not a rate at which defaults end in crises: the strained years that held are
  the comparison, not all years. Not a separation of T2 from the default already running. Not a headline: context to
  K7, whose root rests on the literature''s consensus.'
