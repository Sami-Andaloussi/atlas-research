    two_prices_pct: 5
    two_prices_grid: [2, 10]
    two_prices_months: 3
    flight: m1 (m1c where m1 cannot be read) fallen more since entry than the median change, over a span of the same length, of money-years whose average inflation over that span is in the same band as the money's own average inflation from entry to the date
    flight_log_points: 0.20
    flight_grid: [0.10, 0.30]
    flight_inflation_bands_pct: [below 20, 20-40, 40 or more]
    flight_bands_said: below the onset nearly every life is in the lowest band; the pressure strata carry inflation there
    force_made: a market split or premium first recorded in the month (year) force was imposed; kept after force in permutations
    test_i:
      phases_read: {broke: 'from entry to the crossing (phase 6); a phase first reached after it is a response, described, never in C or its permutations', held: over H fully observed}
      statistic: share of middle-phase pairs in the order 2<3<4<5, averaged over lives
      ties: two phases first reached in the same year (month) count as half an ordered pair, in C and baseline alike
      permutations: 10000
      allowed_orders_only: true
      groups: [broke, held over H fully observed]
      confirmed: broken lives above the baseline's 95th percentile and above held lives by at least 0.10 with the difference's 90 pct bootstrap interval above 0
      refuted: broken lives within the baseline's central 90 pct, or not above held lives
      too_thin_lives_per_group: 20
      second_reading: lives entering by c1 or c2 only, reported beside
      per_pair_of_phases: reported
      variants: [broken lives read to the onset, lives with a war year before their end of reading left out]
    test_ii:
      at_risk: before frame b's onset, the years of a counted spell (entry to entry+H-1)
      event: the onset (the crossing a variant)
      per_phase_ratios: true
      strata: pressure_strata (strain and the state's default included)
      readings_rule: both readings A and B; the verdict both give, else we cannot conclude
      phase_in_onset_year: counted apart, its number said
      war_years: apart; verdict outside them; war years' ratios reported
      headline_era: fiat
      margin_rate_ratio: 1.5
      confirmed: phases 2, 4 and 5 each >= 1.5 with interval above 1
      refuted: each of phases 2, 4 and 5 wholly below 1.5
      phase3: reported, never required
      fit_before: 1946
      fit_before_phases: [5, 4 where the chronologies reach]
      fit_before_why: phase 2 has no source before 1950 but frame d's cuts; with fewer than 20 onsets the check is not run, said
      regions_left_out: true
      scenario_only_if: every region left out keeps each ratio above 1
      too_thin_fiat_onsets: 20

analyses:
  A3:
    parity_uk: 3 pounds 17s 10.5d per oz standard gold
    parity_us: 20.67 USD per fine oz
    before_law: constant hazard, P = lambda/(lambda + r)
    after_law: legislated date, P = q exp(-r (T - t))
    rate: long government yield
    rate_variant: short rate
    q_range: [0, 1]
    cannot_separate_if: q >= 1, or lambda implying resumption within a year for three years or more in a row
  A9: {status: told}
  A10: {margin_points: 10, pooled_routes: [f1, f2], f3: described, strata: [route, tercile, era, the state in default at entry or not], headline: "insured against not (the dossier's more supports standing, a departure listed)", while_f1_cannot_be_read: 'f2 alone, said'}
  A11:
    status: 'declared - not yet: a B (narrow check of v4); no bank read and no verdict computed until Sami decides declared or told; the session recommends told; declared needs a new version writing the flag''s recipe and floor before any bank is read'
    B: 'flagged can confirm with no effect of insolvency risk - (a) the uninsured share held only as a line while a run grows faster than linearly in it (up to 45-100 pct false confirmations in the check''s null, the flag rising with that share); (b) the deposit path already under way in 2022, held by nothing (up to 21-66 pct in the check''s worst cells, whichever way the flag goes)'
    reader_told_if_run_as_written: a confirmed shows banks like SVB lost more deposits in early 2023, not that insolvency under a run sorted them; a refuted leans on total deposits, which include brokered deposits bought to replace a run
    open_with_it: [the flag's recipe not written and not runnable on the frozen FDIC files (O1), amended filings may carry the outcome into the flag (O2), brokered deposits in the refuting measure (O3), no floor and no smallest detectable effect (O4), whether the rule changed between 13 March and 5 April 2023 cannot be checked (O5), interval weights outliers and merger jumps unset (M11), First Republic out by name (M8), the year-end deposit level both the flag's input and the outflow's base with no second yardstick (M9)]
    for_the_record_not_a_rule: in the check's null cells the uninsured share held finely and each bank's own 2022 path bring false confirmations to 0-2 pct - a fifth round of design, on Sami's word only
    status_before_the_narrow_check: tested
    version: Jiang, Matvos, Piskorski and Seru, version of 5 April 2023 (Stanford GSB Research Paper 4080), the earliest that can be had
    why_this_version: the first version (13 March 2023) cannot be had; every later copy (NBER Oct 2023 and Jul 2024, SSRN Apr 2024, JFE 2024) knows the 2023 outflows; the April version's own data are 2022Q1 Call Reports, and banks' 2023Q1 deposits were first published with the Call Reports due 30 April 2023
    flagged: insolvent if half of uninsured depositors withdraw, assets marked to market as that version marks them
    flagged_variant: all uninsured withdraw
    variant_first_republic_in: the three banks out less First Republic (out by name, its run seen by the rule's authors)
    fixed_before: any bank-level 2023Q1 figure (Call Reports due 30 April 2023) - not before the event (SVB and Signature failed on 10 and 12 March)
    recomputed_to: '2022-12-31'
    regression: outflow on flagged, uninsured share controlled
    out: [SVB, Signature, First Republic]
    no_q1_2023_report: as frame j
    margin_points: 2
    confirmed: ">= 2 points with interval above 0"
    refuted: interval wholly below 2
    limit_said: written after SVB failed - tests whether the mechanism named from SVB sorted the other banks' outflows, never whether it could have foreseen SVB
    published_version: JFE 159 (2024) 103899, cited for the mechanism, never read for the rule
  A12: {horizons_years: [1, 3, 5], common_set: true, deflator: local CPI, parallel_rate_if_premium_pct: 10, parallel_rate_needs: a series found, split_without_parallel_series: flagged and reported apart (the official rate understates a foreign refuge's local value), protected_share_pct: 80, protected_grid: [50, 90]}
