declared:
  note: the holes of section 10, listed here so the twin carries them; parameters stay in their blocks
  items:
    - round 3's B1 (claim 2's count carried the state's default) answered by the auditor's repair, not re-audited in depth
    - A11's B (the narrow check of v4) - A11 waits on Sami, declared or told; declared needs a new version writing the flag's recipe and floor before any bank is read
    - frame d waits on Karaman et al.'s series
    - claim 5 (ii) - acts or phases answering inflation expected but not yet in prices; strain beyond its route and tercile
    - claim 2 - strain beyond what its matching holds (route, tercile, era, the state's default)
    - frame d's pattern has no check outside A7's fitting sample
    - the market split is a yes or no where a premium's level would be finer
    - C15's reclassification lines and December spikes (the pilot's O1 and O2)
    - test (ii) cannot refute in practice
    - A11's recomputation reads FDIC's current database, not first filings
    - under force, held, the crossing and a refuge's protection are read on yardsticks the force sets; no second yardstick open for broke
    - the regime's classes carry no second yardstick M0 names
    - A10 reads a loss in the account's own money; a loss by inflation is claim 2's and part 2's
    - an L1 act can leave the statutory cap standing
  default_source_everywhere: 'the state in default at a date - a stock in default in the Bank of Canada-Bank of England database from 1960, Reinhart-Rogoff before (as T2); read so in supports.taken_back.stands, claims.claim2.matching, frames.c.matching, frames.f.matching, analyses.A10.strata and pressure_strata'
step8: {rounds_with_B: [1, 2, 3], round_3: the third round with a B - M0 goes forward with it declared and put to Sami; no fourth round of design, round_3_B1_answer: 'the auditor''s own repair (simulated 0-3 pct false confirmations), not re-audited in depth', narrow_check: 'v4 does what round 3 asked (B1 both repairs at 0-1 pct false confirmations together); A11 not yet - a B, written in section 10 as declared, never patched', narrow_check_report: bank/checks/FT-001-M0-2026-09-30-opus-narrow-check-v4.md}
