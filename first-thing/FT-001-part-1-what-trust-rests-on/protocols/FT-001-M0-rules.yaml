    W_years: 3
    W_grid: [2, 5]
    shown: [m1 where readable, m1c, m2 (recorded outflows plus net errors and omissions over GDP), each also net of its own change over the W years before entry]
    blind_spots_said: {m1: readable only where foreign-currency deposits are banned, m1c: blind to local deposits moving into home foreign-currency deposits, m2: sees only what crosses the border}
    strata: {depth: ["(-10,-5]", "(-20,-10]", "<=-20"], inflation_pct: [below 20, 20-40, 40 or more]}
    difference: open minus closed within strata, n in every cell
    margin: none
    verdict: none
    cannot_be_read: [money-years under a deposit freeze]
  claim4:
    status: told
    coins: named in sourced reading less Terra and UST
    coders: 2
    kappa: true
    verdict: none; outside-the-list mechanisms and splits said
    yield_is_a_support: false
  claim5:
    frames: [c (c3 and c4 entrants from phase 3), d (from phase 3)]
    phase2: frame d cut, L1, or a C15 episode not accommodation read at m0 (C12)
    phase2_c15_date: the episode's crossing c (as route c4 enters); an episode whose c is on or after the onset is a response
    phase4_headline: exchange controls imposed or tightened as dated in Ilzetzki-Reinhart-Rogoff's chronologies (every money, 1946-2016)
    phase4_variants: [bans on foreign money, legal-tender penalties, general price controls - by source]
    phases_standing_at_entry: dated at entry; tie with each other in test (i) (half-ordered), a variant leaves them out; in test (ii) c3 and c4 entrants enter the risk set at their phase 3 date
    phase2_headline: counted whatever the regime
    phase2_variant: not counted under an inflation target
    phase3_headline: a market split recorded while a parity stands
