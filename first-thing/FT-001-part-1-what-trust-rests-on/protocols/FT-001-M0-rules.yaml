claims:
  interval: {level: 0.90, bootstrap_over: monies, draws: 2000}
  smallest_detectable_effect:
    power: 0.80
    alpha_one_sided: 0.05
    printed_beside_each_verdict: true
    claim2_note: 'the 39 points predate claim 2''s default stratum and its reading without taken back; the narrow check reads the rule as written at roughly half that power (15-29 pct against 29-51 pct at 0.5 logit per support); the coding mission prints the rule as written''s effect by the same simulation, on no outcome, before any count'
    at_floors: {claim2_and_A10_points: 39, test_i_C: 0.27, test_ii: 'third audit simulation: confirms 7 pct at a true ratio of 2 per phase, 47 pct at 3; refutes 0-1 pct under no effect'}
    test_ii_said: test (ii) will in practice end we cannot conclude unless each effect is about twice the margin; claim 5 can fail only through test (i)
    said: a verdict at a floor confirms only effects several times the margin
  margins_and_floors: conventions fixed before any data, one per kind (plan Decisions, Headline values)
  pressure_strata:
    inflation_pct: [below 5, 5-10, 10 or more]
    d_inflation_1y_and_3y_points: [<=0, 0-5, above 5]
    depreciation_every_regime: {rate: 'market under floating, official under a parity', level_pct: [below 5, 5-15, 15 or more], d_1y_and_3y_points: [<=0, 0-10, above 10]}
    parity_market_split: [recorded, not]
    reserves_12m_fall_pct: 20
    reserves_grid: [10, 30]
    strain: [frame c route, tercile of the route's measure]
    strain_tercile_cut_points: terciles over all strained at-risk years of that route, the measure read at the date each reading uses
    state_in_default: [yes, no]
    state_in_default_source: 'a stock in default - Bank of Canada-Bank of England database from 1960, Reinhart-Rogoff before (as T2)'
    supports_standing: [one, two or more]
    regime: [parity, floating]
    decade: true
    readings: {A: strata to the end of the year before, B: strata to the end of the year itself}
  claim1:
    status: told (ft-map step 8; rounds 1 and 2 found the same kind of hole, a pressure or common cause missing from the strata)
    span_from: 1970
    break_lines: every frame b crossing of a frame c counted money, in time order, with route and tercile, each headline act (date, source), the onset and its route, the crossing, and in the year before each act inflation, depreciation, reserves' 12-month change, market split, war years
    described_shares: [onset after a headline act within L, onset before the first act in the L years around it, act in the onset's own year (order unreadable), no act at all in the window]
    base_rate: share of strained at-risk years with a headline act in the L years before them (the same window as the shares)
    strained_at_risk_years: years of a counted frame c spell, entry to entry+H-1, before any onset in the spell, inflation the year before below 10, at least one support standing
    L_years: 3
    L_grid: [1, 5]
    forward_table: {exposed: a headline act (T2 L1 L2 L3 H1) in the year, unexposed: no act in the year or the L years before, outcome: an onset in the next L years, strata: pressure_strata, readings: [A, B], shown: [counts and rates by stratum, pooled Mantel-Haenszel ratio, without T2, each act alone], said: strain and expected inflation are not closed; a ratio above 1 cannot be read as the effect of an act, margin: none, verdict: none, war_years: apart}
    timing: described, never counted (here and in frame a, an event study with no verdict); claim 5 counts only the order of phases 2-5 in broken lives and the odds after each phase
  claim2:
    span_from: 1970
    before_1970_variant: count taken back and limit by rule only
    units: spells, one per money per horizon
    broke_and_restored: not held
    separators: [count of supports standing among taken back, limit by rule, limit by institution, force (>=2 vs <=1), each support alone, debt in own money >= half, substitute at hand]
    pegs_and_boards: given with and without them in limit by rule; if the verdict turns, we cannot conclude
    post_2016_regimes: given with and without them
    statistic: Mantel-Haenszel difference in share held
    matching: [route, tercile, era, the state in default at entry or not]
    without_taken_back: the verdict is also given with taken back out of the count; if it turns on it, we cannot conclude
    round_3_B1: the auditor's repair (0-3 pct false confirmations in its null, against 9-59 pct without), declared, not re-audited in depth
    margin_points: 10
    confirmed: ">= 10 points with interval above 0"
    refuted: interval wholly below 10 points
    too_thin_spells_per_side: 20
    war_inside_H_variant: spells with a war year inside H left out
    variants_only: [habit, world demand, reserve status]
  claim3:
    status: told (no open series splits residents' deposits by currency; m1 readable only in closed cells; m1c blind to open cells' main road out; m2 cross-border only)
    wording: holders leave the money more where they are free to and have somewhere to go
    forced: ka_open <= 0.25 or a ban on residents holding foreign money
    forced_grid: [0.1, 0.5]
    substitute: foreign-currency deposits legal, or foreign cash legal, or a land border with an economy whose legal tender is the dollar or the euro
    open: not forced and a substitute at hand
