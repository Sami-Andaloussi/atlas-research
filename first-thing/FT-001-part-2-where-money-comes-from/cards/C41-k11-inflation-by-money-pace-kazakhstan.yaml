id: C41-k11-inflation-by-money-pace-kazakhstan
label: measurement
title: '(Corrected, C40 on C28''s run with Kazakhstan''s splice alone) K11, a base rate: of C28''s ten-year windows in each band of base money growth, how many had inflation averaging
  a fifth a year or more over the decade (a tenth, a variant); counts and shares with their denominators, no slope'
