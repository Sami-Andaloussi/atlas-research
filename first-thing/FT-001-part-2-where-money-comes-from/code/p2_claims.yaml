- id: k1-hierarchy
  component: K1
  type: established
  text: 'Monetary systems are hierarchical: what is money at one level is a promise to pay money from the level above, so
    a deposit is a promise to pay central-bank money, and central-bank money sits at the top at home.'
  sources:
