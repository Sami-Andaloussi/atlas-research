- id: k10-remittances
  component: K10
  type: cases
  text: 'A central bank earns more on its bonds than it pays on its notes and reserves, and hands the profit to the state;
    the Federal Reserve remitted {{cite_fed_remit-2019}} in 2019; when its earnings fell short of what it had to pay, including
    the interest on reserves, in the fall of 2022, it stopped, and booked the shortfall as a deferred asset, profits it must
    earn back before it pays the state again, so until then the state gets nothing from it: {{cite_fed_deferred-2022}} at
    the end of 2022 and {{cite_fed_deferred-2025}} at the end of 2025.'
